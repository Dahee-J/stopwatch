<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강쥐 스탑워치 🐶</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Jua", "Malgun Gothic", -apple-system, sans-serif;
    background: linear-gradient(#fff3f6, #fdf3e7);
    color: #6b4a35;
    min-height: 100vh;
    display: flex; justify-content: center;
    padding: 28px 14px 40px;
  }
  main { width: 100%; max-width: 640px; }

  /* ---------- 시간 카드 ---------- */
  .card {
    position: relative;
    background: #fffaf3;
    border: 3px solid #f1d9c3;
    border-radius: 32px;
    padding: 16px 24px 10px;
    box-shadow: 0 8px 0 #f1d9c3, 0 18px 30px rgba(180, 120, 80, .12);
    text-align: center;
  }
  .meta { display: flex; justify-content: space-between; font-size: 16px; color: #b08566; }
  .meta b { color: #e2738f; font-weight: normal; }
  .time {
    font-size: clamp(54px, 15vw, 88px);
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
    line-height: 1.15;
  }
  .time .ms { font-size: .55em; color: #c79c7c; }
  .card::before, .card::after {
    content: "🐾"; position: absolute; top: -14px; font-size: 24px;
  }
  .card::before { left: 22px; transform: rotate(-20deg); }
  .card::after { right: 22px; transform: rotate(20deg); }

  /* ---------- 장면 ---------- */
  .scene {
    position: relative; height: 300px; margin-top: 22px;
    border-radius: 32px; overflow: hidden;
    background: linear-gradient(#bfe8ff 0%, #e3f5ff 55%, #fdf6ea 100%);
    border: 3px solid #f1d9c3;
  }
  .sun {
    position: absolute; top: 22px; right: 36px; width: 54px; height: 54px; border-radius: 50%;
    background: #ffe28a; box-shadow: 0 0 0 10px rgba(255, 226, 138, .35), 0 0 40px rgba(255, 210, 100, .6);
  }
  .cloud {
    position: absolute; width: 70px; height: 26px; background: #fff; border-radius: 20px;
    animation: cloud linear infinite;
  }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
  .cloud::before { width: 34px; height: 34px; top: -18px; left: 10px; }
  .cloud::after { width: 26px; height: 26px; top: -12px; left: 34px; }
  .c1 { top: 40px; left: 100%; animation-duration: 26s; }
  .c2 { top: 90px; left: 100%; animation-duration: 38s; animation-delay: -14s; transform: scale(.8); }
  .c3 { top: 26px; left: 100%; animation-duration: 32s; animation-delay: -24s; transform: scale(1.15); }
  @keyframes cloud { to { left: -120px; } }

  .hill {
    position: absolute; bottom: 40px; width: 70%; height: 120px; border-radius: 50%;
    background: #c4ebb1;
  }
  .h1 { left: -15%; } .h2 { right: -20%; width: 80%; background: #b5e3a0; bottom: 30px; }

  .fence, .ground { position: absolute; left: 0; right: 0; background-repeat: repeat-x; }
  .fence { bottom: 56px; height: 60px; animation: fenceMove 1.6s linear infinite; }
  .ground { bottom: 0; height: 70px; animation: groundMove .8s linear infinite; }
  @keyframes fenceMove { to { background-position-x: -80px; } }
  @keyframes groundMove { to { background-position-x: -240px; } }
  .scene:not(.running) .fence, .scene:not(.running) .ground { animation-play-state: paused; }
  .scene.sleeping .cloud { animation-play-state: paused; }

  .dogs { position: absolute; left: 0; right: 0; bottom: 26px; height: 190px; }
  .dog { position: absolute; bottom: 0; width: min(46%, 230px); height: auto; overflow: visible; }
  .dog.poodle { left: calc(50% - min(46%, 230px) - 4px); }
  .dog.white { left: calc(50% + 4px); }

  /* SVG 부위 기준점 */
  .leg, .tail, .head, .bob, .eye-open { transform-box: fill-box; }
  .leg { transform-origin: 50% 6%; }
  .tail { transform-origin: 90% 95%; }
  .head { transform-origin: 20% 80%; transition: transform .5s; }
  .bob { transform-origin: 50% 100%; }
  .eye-open { transform-origin: 50% 50%; }

  /* 눈 / 혀 / Zzz 상태 */
  .eye-closed, .tongue, .zzz { display: none; }
  .sleeping .eye-open { display: none; }
  .sleeping .eye-closed { display: inline; }
  .running .tongue { display: inline; }
  .sleeping .zzz { display: block; }
  .scene:not(.sleeping) .eye-open { animation: blink 4s infinite; }
  .poodle .eye-open { animation-delay: -1.3s !important; }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }

  /* 달리기 */
  .running .la { animation: swing .3s ease-in-out infinite alternate; }
  .running .lb { animation: swing .3s ease-in-out infinite alternate-reverse; }
  .running .poodle .la, .running .poodle .lb { animation-duration: .26s; }
  .running .bob { animation: bounce .15s ease-in-out infinite alternate; }
  .running .poodle .bob { animation-duration: .13s; }
  .running .tail { animation: wag .18s ease-in-out infinite alternate; }
  .running .dog.poodle { animation: chase 2.6s ease-in-out infinite; }
  .running .dog.white { animation: chase 3.1s ease-in-out infinite reverse; }
  .running .head { transform: rotate(-4deg); }
  @keyframes swing { from { transform: rotate(-32deg); } to { transform: rotate(32deg); } }
  @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-7px); } }
  @keyframes wag { from { transform: rotate(-18deg); } to { transform: rotate(18deg); } }
  @keyframes chase { 0%, 100% { translate: -8px 0; } 50% { translate: 12px 0; } }

  /* 쉬는 중 */
  .paused .tail { animation: wag .45s ease-in-out infinite alternate; }
  .paused .head { animation: tilt 3.2s ease-in-out infinite; }
  .paused .poodle .head { animation-delay: -1.6s; }
  @keyframes tilt { 0%, 40%, 100% { transform: rotate(0); } 55%, 80% { transform: rotate(-10deg); } }

  /* 자는 중 */
  .sleeping .bob { animation: breathe 3s ease-in-out infinite; }
  .sleeping .poodle .bob { animation-delay: -1.2s; }
  .sleeping .head { transform: rotate(10deg) translateY(6px); }
  @keyframes breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.035); } }
  .zzz {
    position: absolute; font-size: 22px; color: #8aa6c8;
    animation: zzz 2.6s ease-in-out infinite;
  }
  .zzz.z1 { left: 40%; bottom: 175px; }
  .zzz.z2 { left: 82%; bottom: 175px; animation-delay: -1.3s; }
  @keyframes zzz {
    0% { opacity: 0; transform: translate(0, 10px) scale(.7); }
    30% { opacity: 1; }
    100% { opacity: 0; transform: translate(14px, -26px) scale(1.1); }
  }

  /* 랩 효과 */
  .dogs.jump .dog { animation: jump .5s cubic-bezier(.3, 1.6, .6, 1) !important; }
  @keyframes jump { 0%, 100% { translate: 0 0; } 45% { translate: 0 -34px; } }
  .fx { position: absolute; pointer-events: none; font-size: 30px; z-index: 5; }
  .fx.bone { animation: bone .9s ease-out forwards; }
  .fx.heart { font-size: 22px; animation: heart 1.1s ease-out forwards; }
  @keyframes bone {
    0% { transform: translate(0, 0) rotate(0); opacity: 1; }
    100% { transform: translate(var(--dx), -150px) rotate(540deg); opacity: 0; }
  }
  @keyframes heart {
    0% { transform: translateY(0) scale(.5); opacity: 0; }
    20% { opacity: 1; transform: translateY(-10px) scale(1.1); }
    100% { transform: translateY(-70px) scale(.9); opacity: 0; }
  }

  /* ---------- 버튼 ---------- */
  .buttons { display: flex; gap: 14px; margin-top: 20px; }
  button {
    flex: 1; height: 62px; border-radius: 31px; border: 3px solid #f1d9c3;
    font-family: inherit; font-size: 22px; cursor: pointer; color: #6b4a35;
    background: #fffaf3; box-shadow: 0 6px 0 #f1d9c3;
    transition: transform .08s, box-shadow .08s, opacity .2s;
  }
  button:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 1px 0 #f1d9c3; }
  button:disabled { opacity: .45; cursor: default; }
  #startBtn { background: #ff9fb6; border-color: #f07d99; color: #fff; box-shadow: 0 6px 0 #e0718c; }
  #startBtn:active { box-shadow: 0 1px 0 #e0718c; }
  #startBtn.running { background: #ffc46b; border-color: #eea944; box-shadow: 0 6px 0 #dc9a3a; }

  /* ---------- 랩 목록 ---------- */
  ul { list-style: none; margin-top: 22px; background: #fffaf3; border: 3px solid #f1d9c3; border-radius: 24px; padding: 4px 18px; }
  ul:empty { display: none; }
  li {
    display: flex; justify-content: space-between; align-items: center;
    padding: 11px 2px; font-size: 19px; font-variant-numeric: tabular-nums;
    border-bottom: 2px dashed #f3e2d2;
  }
  li:last-child { border-bottom: none; }
  li.current { color: #b9977d; }
  li.best .t { color: #e2738f; }
  li.worst .t { color: #8aa6c8; }
  .hint { text-align: center; margin-top: 16px; font-size: 14px; color: #c3a087; }

  @media (max-width: 520px) {
    .scene { height: 240px; }
    .dogs { height: 150px; }
    .zzz.z1 { bottom: 135px; } .zzz.z2 { bottom: 135px; }
  }
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="meta">
      <span>🐾 걸음 <b id="steps">0</b></span>
      <span id="status">쿨쿨 자는 중 💤</span>
    </div>
    <div class="time" id="display">00:00.<span class="ms">00</span></div>
  </div>

  <div class="scene sleeping" id="scene">
    <div class="sun"></div>
    <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
    <div class="hill h1"></div><div class="hill h2"></div>
    <div class="fence" id="fence"></div>
    <div class="ground" id="ground"></div>
    <div class="dogs" id="dogs"></div>
  </div>

  <div class="buttons">
    <button id="lapBtn" disabled>🦴 랩</button>
    <button id="startBtn">🐾 산책 시작</button>
  </div>

  <ul id="laps"></ul>
  <p class="hint">Space 시작/정지 · L 랩(간식 던지기!) · R 초기화</p>
</main>

<script>
/* ================= 강아지 그리기 ================= */
// 원 여러 개를 겹쳐 몽글몽글한 털 뭉치를 만들고, 바깥 윤곽선을 그려줍니다.
const fluff = (list, fill, stroke, sw = 3) =>
  list.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r + sw}" fill="${stroke}"/>`).join('') +
  list.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}"/>`).join('');

const eyes = (x, y) => `
  <g class="eye-open"><circle cx="${x}" cy="${y}" r="6" fill="#2d2320"/><circle cx="${x + 2}" cy="${y - 2}" r="2" fill="#fff"/></g>
  <path class="eye-closed" d="M${x - 6} ${y} q6 6 12 0" stroke="#2d2320" stroke-width="3" fill="none" stroke-linecap="round"/>`;

const face = (ex, ey, nx, ny, blushX, blushY, mx, my) => `
  ${eyes(ex, ey)}
  <ellipse cx="${nx}" cy="${ny}" rx="7" ry="5.5" fill="#2d2320"/>
  <ellipse cx="${nx - 2}" cy="${ny - 2}" rx="2" ry="1.3" fill="#fff" opacity=".6"/>
  <path class="tongue" d="M${mx + 2} ${my + 2} q5 14 10 0 z" fill="#ff8fa3" stroke="#e36b85" stroke-width="1.5"/>
  <path d="M${mx} ${my} q5 6 10 0 q5 6 10 0" stroke="#2d2320" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <ellipse cx="${blushX}" cy="${blushY}" rx="8" ry="5" fill="#ffb3c4" opacity=".8"/>`;

function whiteDog() {
  const W = '#ffffff', S = '#e9ddcf', D = '#f3ebe1';
  const leg = (x, cls, fill) =>
    `<g class="leg ${cls}"><rect x="${x - 10}" y="118" width="20" height="60" rx="10" fill="${fill}" stroke="${S}" stroke-width="3"/></g>`;
  return `
  <svg class="dog white" viewBox="0 0 240 190">
    <ellipse cx="115" cy="184" rx="78" ry="6" fill="rgba(90,70,40,.12)"/>
    <g class="bob">
      ${leg(88, 'lb', D)}${leg(156, 'la', D)}
      <g class="tail">${fluff([[46, 92, 13], [36, 82, 10], [52, 80, 9]], W, S)}</g>
      ${leg(72, 'la', W)}${leg(140, 'lb', W)}
      ${fluff([[76, 112, 28], [106, 104, 31], [136, 110, 28], [108, 130, 24], [80, 132, 20], [140, 130, 20]], W, S)}
      <g class="head">
        ${fluff([[168, 78, 32], [152, 56, 15], [173, 48, 16], [190, 60, 13], [145, 80, 14], [196, 92, 16]], W, S)}
        <ellipse cx="149" cy="92" rx="13" ry="23" fill="${D}" stroke="${S}" stroke-width="3" transform="rotate(18 149 92)"/>
        <g transform="translate(160 40) rotate(-15)">
          <path d="M0 0 L-14 -9 L-14 9 Z M0 0 L14 -9 L14 9 Z" fill="#ff8fab" stroke="#e8708f" stroke-width="2" stroke-linejoin="round"/>
          <circle r="4.5" fill="#ff8fab" stroke="#e8708f" stroke-width="2"/>
        </g>
        ${face(178, 76, 209, 88, 185, 98, 193, 99)}
      </g>
    </g>
  </svg>`;
}

function poodle() {
  const M = '#b97a45', L = '#d29a66', D = '#93592b', S = '#7a4823';
  const leg = (x, cls, fill) => `
    <g class="leg ${cls}">
      <rect x="${x - 6}" y="116" width="12" height="54" rx="6" fill="${fill}" stroke="${S}" stroke-width="2.5"/>
      ${fluff([[x, 172, 9], [x + 5, 168, 6]], fill === D ? D : M, S, 2.5)}
    </g>`;
  return `
  <svg class="dog poodle" viewBox="0 0 240 190">
    <ellipse cx="115" cy="184" rx="74" ry="6" fill="rgba(90,70,40,.12)"/>
    <g class="bob">
      ${leg(84, 'lb', D)}${leg(150, 'la', D)}
      <g class="tail">
        <path d="M54 108 L38 74" stroke="${S}" stroke-width="10" stroke-linecap="round"/>
        <path d="M54 108 L38 74" stroke="${M}" stroke-width="5" stroke-linecap="round"/>
        ${fluff([[35, 64, 13], [27, 72, 8], [42, 57, 8]], M, S, 2.5)}
      </g>
      ${leg(70, 'la', M)}${leg(136, 'lb', M)}
      <ellipse cx="104" cy="118" rx="42" ry="16" fill="${M}" stroke="${S}" stroke-width="2.5"/>
      ${fluff([[66, 108, 21], [55, 119, 14], [76, 124, 14]], M, S, 2.5)}
      ${fluff([[140, 108, 23], [152, 94, 18], [128, 124, 14], [148, 124, 14]], M, S, 2.5)}
      <g fill="${L}" opacity=".55">
        <circle cx="60" cy="104" r="5"/><circle cx="72" cy="112" r="4"/>
        <circle cx="138" cy="102" r="5"/><circle cx="150" cy="90" r="4"/><circle cx="132" cy="118" r="4"/>
      </g>
      <g class="head">
        ${fluff([[168, 74, 20], [162, 50, 16], [148, 56, 12], [177, 50, 12], [162, 38, 11]], M, S, 2.5)}
        <ellipse cx="191" cy="84" rx="20" ry="11" fill="${L}" stroke="${S}" stroke-width="2.5"/>
        ${fluff([[149, 86, 11], [146, 102, 11], [150, 117, 9]], D, S, 2.5)}
        <g fill="${L}" opacity=".55"><circle cx="157" cy="44" r="4"/><circle cx="168" cy="38" r="3.5"/><circle cx="150" cy="54" r="3.5"/></g>
        ${face(172, 70, 209, 82, 178, 88, 190, 92)}
      </g>
    </g>
  </svg>`;
}

document.getElementById('dogs').innerHTML =
  poodle() + whiteDog() + '<div class="zzz z1">Z z z</div><div class="zzz z2">Z z</div>';

// 울타리와 잔디 무늬
const svgURL = s => `url("data:image/svg+xml,${encodeURIComponent(s)}")`;
document.getElementById('fence').style.backgroundImage = svgURL(
  `<svg xmlns="http://www.w3.org/2000/svg" width="80" height="60">
    <rect x="0" y="16" width="80" height="8" fill="#fffaf2" stroke="#e8d3bb" stroke-width="2"/>
    <rect x="0" y="36" width="80" height="8" fill="#fffaf2" stroke="#e8d3bb" stroke-width="2"/>
    <path d="M14 60 V8 L22 2 L30 8 V60 Z" fill="#fffaf2" stroke="#e8d3bb" stroke-width="2"/>
    <path d="M54 60 V8 L62 2 L70 8 V60 Z" fill="#fffaf2" stroke="#e8d3bb" stroke-width="2"/>
  </svg>`);
document.getElementById('ground').style.backgroundImage = svgURL(
  `<svg xmlns="http://www.w3.org/2000/svg" width="240" height="70">
    <rect width="240" height="70" fill="#9fd889"/>
    <rect y="0" width="240" height="8" fill="#b6e59f"/>
    <g fill="#86c872">
      <path d="M20 30 l4 -12 l4 12z M26 30 l3 -9 l3 9z"/>
      <path d="M110 50 l4 -12 l4 12z M116 50 l3 -9 l3 9z"/>
      <path d="M196 34 l4 -12 l4 12z"/>
    </g>
    <g><circle cx="68" cy="26" r="5" fill="#fff"/><circle cx="68" cy="26" r="2.2" fill="#ffd25e"/></g>
    <g><circle cx="160" cy="48" r="5" fill="#ffb3c6"/><circle cx="160" cy="48" r="2.2" fill="#fff3b0"/></g>
    <g><circle cx="222" cy="58" r="4" fill="#fff"/><circle cx="222" cy="58" r="1.8" fill="#ffd25e"/></g>
    <g fill="#8fcf79" opacity=".8"><circle cx="40" cy="56" r="2"/><circle cx="134" cy="22" r="2"/><circle cx="190" cy="14" r="2"/></g>
  </svg>`);

/* ================= 스탑워치 로직 ================= */
const $ = id => document.getElementById(id);
const display = $('display'), startBtn = $('startBtn'), lapBtn = $('lapBtn');
const lapList = $('laps'), scene = $('scene'), stepsEl = $('steps'), statusEl = $('status');
const dogsEl = $('dogs');

let running = false, startTime = 0, elapsed = 0, lapStart = 0, laps = [];

const now = () => running ? elapsed + (performance.now() - startTime) : elapsed;
const pad = n => String(n).padStart(2, '0');
function fmt(ms) {
  const h = Math.floor(ms / 3600000), m = Math.floor(ms / 60000) % 60;
  const s = Math.floor(ms / 1000) % 60, cs = Math.floor(ms / 10) % 100;
  return { main: (h ? h + ':' + pad(m) : pad(m)) + ':' + pad(s), cs: pad(cs) };
}

function setState() {
  const state = running ? 'running' : (elapsed ? 'paused' : 'sleeping');
  scene.className = 'scene ' + state;
  statusEl.textContent = {
    running: '신나게 산책 중! 🐕💨',
    paused: '킁킁 쉬는 중 🐶',
    sleeping: '쿨쿨 자는 중 💤',
  }[state];
  startBtn.textContent = running ? '✋ 멈춰!' : (elapsed ? '🐾 다시 출발' : '🐾 산책 시작');
  startBtn.classList.toggle('running', running);
  lapBtn.disabled = !running && elapsed === 0;
  lapBtn.textContent = running || elapsed === 0 ? '🦴 랩' : '🏠 집으로 (초기화)';
}

function renderLaps() {
  lapList.innerHTML = '';
  if (!running && elapsed === 0) return;
  const cur = document.createElement('li');
  cur.className = 'current';
  cur.innerHTML = `<span>🐾 랩 ${laps.length + 1}</span><span class="t"></span>`;
  lapList.appendChild(cur);
  const min = Math.min(...laps), max = Math.max(...laps);
  for (let i = laps.length - 1; i >= 0; i--) {
    const li = document.createElement('li');
    let icon = '🦴';
    if (laps.length >= 2 && laps[i] === min) { li.className = 'best'; icon = '🏆'; }
    else if (laps.length >= 2 && laps[i] === max) { li.className = 'worst'; icon = '🐢'; }
    const f = fmt(laps[i]);
    li.innerHTML = `<span>${icon} 랩 ${i + 1}</span><span class="t">${f.main}.${f.cs}</span>`;
    lapList.appendChild(li);
  }
}

function tick() {
  const t = now();
  const f = fmt(t);
  display.innerHTML = `${f.main}.<span class="ms">${f.cs}</span>`;
  stepsEl.textContent = Math.floor(t / 280).toLocaleString();
  const cur = lapList.querySelector('li.current .t');
  if (cur) { const l = fmt(t - lapStart); cur.textContent = `${l.main}.${l.cs}`; }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

function toggle() {
  if (running) { elapsed += performance.now() - startTime; running = false; }
  else { startTime = performance.now(); running = true; }
  setState(); renderLaps();
}

function spawn(cls, text, x, y, dx) {
  const el = document.createElement('div');
  el.className = 'fx ' + cls; el.textContent = text;
  el.style.left = x + 'px'; el.style.top = y + 'px';
  if (dx !== undefined) el.style.setProperty('--dx', dx + 'px');
  scene.appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}

function lap() {
  if (!running) return;
  const t = now(); laps.push(t - lapStart); lapStart = t;
  renderLaps();
  // 간식 던지기 + 점프 + 하트
  const w = scene.clientWidth, h = scene.clientHeight;
  spawn('bone', '🦴', w / 2 - 15, h - 120, (Math.random() - .5) * 160);
  dogsEl.classList.remove('jump'); void dogsEl.offsetWidth; dogsEl.classList.add('jump');
  setTimeout(() => dogsEl.classList.remove('jump'), 520);
  [w * .3, w * .72].forEach((x, i) =>
    setTimeout(() => spawn('heart', i ? '💗' : '🧡', x, h - 210), i * 120));
}

function reset() {
  if (running) return;
  elapsed = 0; lapStart = 0; laps = [];
  setState(); renderLaps();
}

startBtn.addEventListener('click', toggle);
lapBtn.addEventListener('click', () => running ? lap() : reset());
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.key === 'l' || e.key === 'L') lap();
  else if (e.key === 'r' || e.key === 'R') reset();
});
setState();
</script>
