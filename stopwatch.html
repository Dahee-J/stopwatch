<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스탑워치</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b22;
    --text: #e8eaed;
    --muted: #8a909c;
    --green: #2ecc71;
    --red: #e74c3c;
    --line: #262a33;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 60px 16px;
  }
  .wrap { width: 100%; max-width: 420px; }
  .time {
    font-variant-numeric: tabular-nums;
    font-size: clamp(48px, 16vw, 76px);
    font-weight: 300;
    text-align: center;
    letter-spacing: 1px;
    margin-bottom: 36px;
  }
  .time .ms { color: var(--muted); font-size: 0.6em; }
  .buttons {
    display: flex;
    justify-content: space-between;
    margin-bottom: 28px;
  }
  button {
    width: 88px; height: 88px;
    border-radius: 50%;
    border: none;
    font-size: 17px;
    font-family: inherit;
    cursor: pointer;
    transition: transform .08s, opacity .15s;
  }
  button:active { transform: scale(0.95); }
  button:disabled { opacity: .35; cursor: default; }
  #lapBtn { background: #2a2e37; color: var(--text); }
  #startBtn { background: rgba(46,204,113,.18); color: var(--green); }
  #startBtn.running { background: rgba(231,76,60,.18); color: var(--red); }
  ul { list-style: none; border-top: 1px solid var(--line); }
  li {
    display: flex;
    justify-content: space-between;
    padding: 13px 4px;
    border-bottom: 1px solid var(--line);
    font-variant-numeric: tabular-nums;
    font-size: 16px;
  }
  li.best { color: var(--green); }
  li.worst { color: var(--red); }
  .hint { text-align: center; color: var(--muted); font-size: 13px; margin-top: 22px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="time" id="display">00:00.<span class="ms">00</span></div>

  <div class="buttons">
    <button id="lapBtn" disabled>랩</button>
    <button id="startBtn">시작</button>
  </div>

  <ul id="laps"></ul>
  <p class="hint">Space: 시작/정지 · L: 랩 · R: 초기화</p>
</div>

<script>
  const display = document.getElementById('display');
  const startBtn = document.getElementById('startBtn');
  const lapBtn = document.getElementById('lapBtn');
  const lapList = document.getElementById('laps');

  let running = false;
  let startTime = 0;     // performance.now() 기준 시작 시점
  let elapsed = 0;       // 정지 시점까지 누적된 시간(ms)
  let lapStart = 0;      // 현재 랩이 시작된 누적 시간
  let laps = [];         // 각 랩 소요 시간(ms)
  let rafId = null;

  function format(ms) {
    const h = Math.floor(ms / 3600000);
    const m = Math.floor(ms / 60000) % 60;
    const s = Math.floor(ms / 1000) % 60;
    const cs = Math.floor(ms / 10) % 100;
    const pad = n => String(n).padStart(2, '0');
    const main = (h > 0 ? h + ':' + pad(m) : pad(m)) + ':' + pad(s);
    return { main, cs: pad(cs) };
  }

  function now() {
    return running ? elapsed + (performance.now() - startTime) : elapsed;
  }

  function render() {
    const t = format(now());
    display.innerHTML = `${t.main}.<span class="ms">${t.cs}</span>`;
    const cur = lapList.querySelector('li.current span:last-child');
    if (cur) {
      const lt = format(now() - lapStart);
      cur.textContent = `${lt.main}.${lt.cs}`;
    }
    if (running) rafId = requestAnimationFrame(render);
  }

  function renderLaps() {
    lapList.innerHTML = '';
    if (!running && elapsed === 0) return;

    // 진행 중인 현재 랩
    const cur = document.createElement('li');
    cur.className = 'current';
    const lt = format(now() - lapStart);
    cur.innerHTML = `<span>랩 ${laps.length + 1}</span><span>${lt.main}.${lt.cs}</span>`;
    lapList.appendChild(cur);

    const min = Math.min(...laps), max = Math.max(...laps);
    for (let i = laps.length - 1; i >= 0; i--) {
      const li = document.createElement('li');
      if (laps.length >= 2) {
        if (laps[i] === min) li.className = 'best';
        else if (laps[i] === max) li.className = 'worst';
      }
      const f = format(laps[i]);
      li.innerHTML = `<span>랩 ${i + 1}</span><span>${f.main}.${f.cs}</span>`;
      lapList.appendChild(li);
    }
  }

  function updateButtons() {
    startBtn.textContent = running ? '정지' : '시작';
    startBtn.classList.toggle('running', running);
    if (running) {
      lapBtn.textContent = '랩';
      lapBtn.disabled = false;
    } else {
      lapBtn.textContent = '초기화';
      lapBtn.disabled = elapsed === 0;
      if (elapsed === 0) lapBtn.textContent = '랩';
    }
  }

  function toggle() {
    if (running) {
      elapsed += performance.now() - startTime;
      running = false;
      cancelAnimationFrame(rafId);
    } else {
      startTime = performance.now();
      running = true;
      rafId = requestAnimationFrame(render);
    }
    updateButtons();
    renderLaps();
    render();
  }

  function lap() {
    if (!running) return;
    const t = now();
    laps.push(t - lapStart);
    lapStart = t;
    renderLaps();
  }

  function reset() {
    if (running) return;
    elapsed = 0; lapStart = 0; laps = [];
    renderLaps();
    render();
    updateButtons();
  }

  startBtn.addEventListener('click', toggle);
  lapBtn.addEventListener('click', () => running ? lap() : reset());

  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.key === 'l' || e.key === 'L') lap();
    else if (e.key === 'r' || e.key === 'R') reset();
  });
</script>
</body>
</html>
