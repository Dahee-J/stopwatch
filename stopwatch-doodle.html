<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>꼬질 강쥐 스탑워치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #5a4a40; --paper: #fcfbf8; --soft: #f4efe6; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Gaegu", "Malgun Gothic", sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    display: flex; justify-content: center;
    padding: 30px 14px 40px;
  }
  main { width: 100%; max-width: 560px; }

  /* 손으로 그린 듯한 테두리 */
  .sketch {
    border: 2px solid var(--ink);
    border-radius: 255px 18px 225px 18px / 18px 225px 18px 255px;
  }

  .title { text-align: center; font-size: 30px; font-weight: 700; margin-bottom: 14px; }

  .card { background: #fff; padding: 10px 26px 4px; text-align: center; }
  .meta { display: flex; justify-content: space-between; font-size: 20px; opacity: .8; }
  .time {
    font-size: clamp(64px, 17vw, 100px); font-weight: 700;
    font-variant-numeric: tabular-nums; line-height: 1.05; letter-spacing: 1px;
  }
  .time .ms { font-size: .55em; opacity: .55; }

  /* ---------- 장면 ---------- */
  .scene {
    position: relative; height: 270px; margin-top: 18px; overflow: hidden;
    background: #fff;
  }
  .cloud { position: absolute; width: 80px; animation: drift linear infinite; left: 100%; }
  .cl1 { top: 22px; animation-duration: 34s; }
  .cl2 { top: 64px; width: 60px; animation-duration: 46s; animation-delay: -20s; }
  .cl3 { top: 30px; width: 70px; animation-duration: 40s; animation-delay: -33s; }
  @keyframes drift { to { left: -100px; } }
  .scene.sleeping .cloud { animation-play-state: paused; }

  .ground {
    position: absolute; left: 0; right: 0; bottom: 0; height: 64px;
    background-repeat: repeat-x; animation: groundMove 1.1s linear infinite;
  }
  @keyframes groundMove { to { background-position-x: -200px; } }
  .scene:not(.running) .ground { animation-play-state: paused; }

  .dogs {
    position: absolute; left: 0; right: 0; bottom: 34px;
    display: flex; justify-content: center; align-items: flex-end; gap: 34px;
  }
  .dog { width: 156px; height: auto; overflow: visible; }

  .wob, .head, .foot, .tail, .ear, .eye-open { transform-box: fill-box; }
  .wob { transform-origin: 50% 100%; }
  .head { transform-origin: 50% 85%; transition: transform .4s; }
  .foot { transform-origin: 50% 50%; }
  .tail { transform-origin: 0% 100%; }
  .ear.l { transform-origin: 80% 10%; } .ear.r { transform-origin: 20% 10%; }

  .eye-closed, .tongue, .zzz { display: none; }
  .sleeping .eye-open { display: none; }
  .sleeping .eye-closed { display: inline; }
  .running .tongue { display: inline; }
  .sleeping .zzz { display: block; }
  .scene:not(.sleeping) .eye-open { animation: blink 4.2s infinite; transform-origin: 50% 50%; }
  .poodle .eye-open { animation-delay: -1.7s !important; }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.15); } }

  /* 아장아장 걷기 */
  .running .wob { animation: waddle .36s ease-in-out infinite alternate; }
  .running .poodle .wob { animation-duration: .32s; animation-direction: alternate-reverse; }
  .running .foot.l { animation: step .36s ease-in-out infinite alternate; }
  .running .foot.r { animation: step .36s ease-in-out infinite alternate-reverse; }
  .running .poodle .foot.l, .running .poodle .foot.r { animation-duration: .32s; }
  .running .ear.l { animation: flopL .18s ease-in-out infinite alternate; }
  .running .ear.r { animation: flopR .18s ease-in-out infinite alternate; }
  .running .tail { animation: wag .16s ease-in-out infinite alternate; }
  @keyframes waddle {
    from { transform: rotate(-6deg) translateY(0); }
    to   { transform: rotate(6deg) translateY(-5px); }
  }
  @keyframes step { from { transform: translateY(0); } to { transform: translateY(-6px); } }
  @keyframes flopL { from { transform: rotate(0); } to { transform: rotate(14deg); } }
  @keyframes flopR { from { transform: rotate(0); } to { transform: rotate(-14deg); } }
  @keyframes wag { from { transform: rotate(-20deg); } to { transform: rotate(20deg); } }

  /* 쉬는 중 */
  .paused .tail { animation: wag .5s ease-in-out infinite alternate; }
  .paused .head { animation: tilt 3.4s ease-in-out infinite; }
  .paused .poodle .head { animation-delay: -1.7s; animation-direction: reverse; }
  @keyframes tilt { 0%, 45%, 100% { transform: rotate(0); } 58%, 85% { transform: rotate(-9deg); } }

  /* 자는 중 */
  .sleeping .wob { animation: breathe 3s ease-in-out infinite; }
  .sleeping .poodle .wob { animation-delay: -1.3s; }
  .sleeping .head { transform: rotate(6deg) translateY(3px); }
  .sleeping .poodle .head { transform: rotate(-6deg) translateY(3px); }
  @keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.02, .975); } }
  .zzz { position: absolute; font-size: 24px; font-weight: 700; opacity: .7; animation: zzz 2.8s ease-in-out infinite; }
  .zzz.z1 { left: calc(50% - 80px); bottom: 205px; }
  .zzz.z2 { left: calc(50% + 135px); bottom: 200px; animation-delay: -1.4s; }
  @keyframes zzz {
    0% { opacity: 0; transform: translate(0, 8px) scale(.7); }
    30% { opacity: .7; }
    100% { opacity: 0; transform: translate(12px, -24px) scale(1.05); }
  }

  /* 랩 효과 */
  .dogs.jump .dog { animation: jump .5s cubic-bezier(.3, 1.6, .6, 1); }
  .dogs.jump .poodle { animation-delay: .07s; }
  @keyframes jump { 0%, 100% { translate: 0 0; } 45% { translate: 0 -30px; } }
  .fx { position: absolute; pointer-events: none; z-index: 5; }
  .fx.bone { width: 40px; animation: bone .9s ease-out forwards; }
  .fx.heart { font-size: 30px; font-weight: 700; color: #e59a95; animation: heart 1.1s ease-out forwards; }
  @keyframes bone {
    0% { transform: translate(0, 0) rotate(0); opacity: 1; }
    100% { transform: translate(var(--dx), -140px) rotate(400deg); opacity: 0; }
  }
  @keyframes heart {
    0% { transform: translateY(0) scale(.5); opacity: 0; }
    25% { opacity: 1; transform: translateY(-8px) scale(1.1); }
    100% { transform: translateY(-60px) scale(.9); opacity: 0; }
  }

  /* ---------- 버튼 ---------- */
  .buttons { display: flex; gap: 14px; margin-top: 18px; }
  button {
    flex: 1; height: 60px; font-family: inherit; font-size: 26px; font-weight: 700;
    color: var(--ink); background: #fff; cursor: pointer;
    border: 2px solid var(--ink);
    border-radius: 255px 18px 225px 18px / 18px 225px 18px 255px;
    transition: transform .08s, background .2s, opacity .2s;
  }
  button:hover:not(:disabled) { background: var(--soft); }
  button:active:not(:disabled) { transform: scale(.97) rotate(-1deg); }
  button:disabled { opacity: .35; cursor: default; }
  #startBtn { background: #f7e1dc; }
  #startBtn:hover { background: #f2d3cc; }
  #startBtn.running { background: #e9eef3; }

  /* ---------- 랩 목록 ---------- */
  ul { list-style: none; margin-top: 18px; background: #fff; padding: 4px 22px; }
  ul:empty { display: none; }
  li {
    display: flex; justify-content: space-between; padding: 9px 2px;
    font-size: 23px; font-variant-numeric: tabular-nums;
    border-bottom: 2px dashed #e4dcd0;
  }
  li:last-child { border-bottom: none; }
  li.current { opacity: .55; }
  li.best .t { color: #d07f78; }
  li.worst .t { color: #8a9bb0; }
  .hint { text-align: center; margin-top: 14px; font-size: 18px; opacity: .55; }

  @media (max-width: 460px) {
    .dog { width: 112px; } .dogs { gap: 20px; }
    .zzz.z1 { left: calc(50% - 60px); bottom: 160px; } .zzz.z2 { left: calc(50% + 96px); bottom: 156px; }
  }
</style>
</head>
<body>
<!-- 손그림처럼 선을 살짝 흔들어 주는 필터 -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="2.2"/>
    </filter>
  </defs>
</svg>

<main>
  <h1 class="title">꼬질 강쥐 스탑워치</h1>

  <div class="card sketch">
    <div class="meta"><span>걸음 <b id="steps">0</b></span><span id="status">쿨쿨 자는 중</span></div>
    <div class="time" id="display">00:00.<span class="ms">00</span></div>
  </div>

  <div class="scene sketch sleeping" id="scene">
    <div class="ground" id="ground"></div>
    <div class="dogs" id="dogs"></div>
  </div>

  <div class="buttons">
    <button id="lapBtn" disabled>랩</button>
    <button id="startBtn">산책 가자!</button>
  </div>

  <ul class="sketch" id="laps"></ul>
  <p class="hint">Space 시작/정지 · L 랩 · R 초기화</p>
</main>

<script>
/* ============ 그림 도구 ============ */
// 항상 같은 모양이 나오도록 고정 시드 난수
function rng(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
// 몽글몽글 털 뭉치 윤곽 (가장자리에 작은 털 봉우리)
function blob(cx, cy, rx, ry, n, amp, seed, jit = 0.04) {
  const r = rng(seed), P = (a, k) => [cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k];
  const base = [];
  for (let i = 0; i < n; i++) base.push(1 + (r() * 2 - 1) * jit);
  let d = '';
  for (let i = 0; i <= n; i++) {
    const a = i / n * Math.PI * 2 - Math.PI / 2;
    const [x, y] = P(a, base[i % n]);
    if (i === 0) { d += `M${x.toFixed(1)} ${y.toFixed(1)}`; continue; }
    const am = (i - 0.5) / n * Math.PI * 2 - Math.PI / 2;
    const [qx, qy] = P(am, 1 + amp * (1.6 + r() * 0.8));
    d += ` Q${qx.toFixed(1)} ${qy.toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)}`;
  }
  return d + 'Z';
}
const INK = '#5a4a40';

/* ============ 하얀 꼬질 강아지 ============ */
function whiteDog() {
  const F = '#fdfbf6', E = '#f3ede3';
  const line = `stroke="${INK}" stroke-width="1.7" stroke-dasharray="3 2.2" stroke-linecap="round" stroke-linejoin="round"`;
  return `
  <svg class="dog white" viewBox="0 0 120 132">
   <g filter="url(#rough)">
    <ellipse cx="60" cy="126" rx="34" ry="4" fill="rgba(90,74,64,.1)"/>
    <g class="wob">
      <g class="tail"><path d="${blob(94, 96, 10, 9, 9, .14, 11)}" fill="${F}" ${line}/></g>
      <path d="${blob(60, 98, 31, 25, 18, .07, 3)}" fill="${F}" ${line}/>
      <g class="foot l"><path d="${blob(47, 120, 9, 6.5, 8, .1, 21)}" fill="${F}" ${line}/></g>
      <g class="foot r"><path d="${blob(73, 120, 9, 6.5, 8, .1, 22)}" fill="${F}" ${line}/></g>
      <g fill="#bfb2a3" opacity=".55"><circle cx="50" cy="103" r=".9"/><circle cx="54" cy="107" r=".7"/><circle cx="71" cy="100" r=".8"/></g>
      <g class="head">
        <path d="${blob(60, 54, 37, 33, 24, .06, 7)}" fill="${F}" ${line}/>
        <path d="M50 24 q3 -6 6 -1 M58 22 q3 -7 6 0 M66 24 q3 -5 5 1" fill="none" ${line}/>
        <g class="ear l"><path d="${blob(27, 60, 11, 18, 11, .1, 31)}" fill="${E}" ${line}/></g>
        <g class="ear r"><path d="${blob(93, 60, 11, 18, 11, .1, 32)}" fill="${E}" ${line}/></g>
        ${face(60, 0)}
      </g>
    </g>
   </g>
  </svg>`;
}

/* ============ 갈색 꼬질 푸들 ============ */
function poodle() {
  const F = '#b28d78', E = '#977262', M = '#cbae9c';
  const line = `stroke="${INK}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"`;
  return `
  <svg class="dog poodle" viewBox="0 0 120 132">
   <g filter="url(#rough)">
    <ellipse cx="60" cy="126" rx="34" ry="4" fill="rgba(90,74,64,.1)"/>
    <g class="wob">
      <g class="tail"><path d="${blob(94, 94, 10, 10, 9, .2, 41)}" fill="${F}" ${line}/></g>
      <path d="${blob(60, 98, 29, 24, 16, .12, 43)}" fill="${F}" ${line}/>
      <g class="foot l"><path d="${blob(47, 120, 9, 7, 8, .16, 44)}" fill="${F}" ${line}/></g>
      <g class="foot r"><path d="${blob(73, 120, 9, 7, 8, .16, 45)}" fill="${F}" ${line}/></g>
      <g fill="none" stroke="${E}" stroke-width="1.3" stroke-linecap="round">
        <path d="M50 96 q3 -3 5 0"/><path d="M64 104 q3 -3 5 0"/><path d="M56 110 q3 -3 5 0"/>
      </g>
      <g class="head">
        <g class="ear l"><path d="${blob(27, 62, 13, 20, 12, .2, 51)}" fill="${E}" ${line}/></g>
        <g class="ear r"><path d="${blob(93, 62, 13, 20, 12, .2, 52)}" fill="${E}" ${line}/></g>
        <path d="${blob(60, 54, 33, 31, 20, .11, 47)}" fill="${F}" ${line}/>
        <path d="${blob(60, 26, 17, 11, 10, .2, 49)}" fill="${F}" ${line}/>
        <g fill="none" stroke="${E}" stroke-width="1.3" stroke-linecap="round">
          <path d="M52 26 q3 -3 5 0"/><path d="M63 24 q3 -3 5 0"/><path d="M42 44 q3 -3 5 0"/><path d="M74 42 q3 -3 5 0"/>
        </g>
        <ellipse cx="60" cy="68" rx="13" ry="9.5" fill="${M}"/>
        ${face(60, 1)}
      </g>
    </g>
   </g>
  </svg>`;
}

function face(cx, k) {
  const ey = 56 + k, ny = 64 + k;
  return `
    <g class="eye-open"><circle cx="${cx - 12}" cy="${ey}" r="2.8" fill="#2f2621"/><circle cx="${cx + 12}" cy="${ey}" r="2.8" fill="#2f2621"/></g>
    <g class="eye-closed" fill="none" stroke="#2f2621" stroke-width="1.8" stroke-linecap="round">
      <path d="M${cx - 15.5} ${ey} q3.5 3 7 0"/><path d="M${cx + 8.5} ${ey} q3.5 3 7 0"/>
    </g>
    <ellipse cx="${cx}" cy="${ny}" rx="3.8" ry="2.8" fill="#2f2621"/>
    <path class="tongue" d="M${cx - 2.5} ${ny + 7} q2.5 7 5 0 z" fill="#ec9a98" stroke="${INK}" stroke-width="1"/>
    <path d="M${cx - 4.5} ${ny + 5} q2.25 2.6 4.5 0 q2.25 2.6 4.5 0" fill="none" stroke="#2f2621" stroke-width="1.4" stroke-linecap="round"/>
    <ellipse cx="${cx - 20}" cy="${ny + 2}" rx="5" ry="3" fill="#f0b4ab" opacity=".5"/>
    <ellipse cx="${cx + 20}" cy="${ny + 2}" rx="5" ry="3" fill="#f0b4ab" opacity=".5"/>`;
}

const cloudSVG = cls => `<svg class="cloud ${cls}" viewBox="0 0 80 36"><path filter="url(#rough)"
  d="M14 32 Q2 32 4 22 Q6 14 16 16 Q18 4 32 6 Q42 -2 52 8 Q66 4 68 16 Q78 18 76 26 Q74 32 64 32 Z"
  fill="#fff" stroke="${INK}" stroke-width="1.5" stroke-linejoin="round" opacity=".7"/></svg>`;

const scene = document.getElementById('scene');
scene.insertAdjacentHTML('afterbegin', cloudSVG('cl1') + cloudSVG('cl2') + cloudSVG('cl3'));
document.getElementById('dogs').innerHTML = whiteDog() + poodle();
scene.insertAdjacentHTML('beforeend', '<div class="zzz z1">z Z</div><div class="zzz z2">Z z</div>');

const svgURL = s => `url("data:image/svg+xml,${encodeURIComponent(s)}")`;
document.getElementById('ground').style.backgroundImage = svgURL(
  `<svg xmlns="http://www.w3.org/2000/svg" width="200" height="64">
    <path d="M0 14 Q25 11 50 14 T100 14 T150 14 T200 14" fill="none" stroke="${INK}" stroke-width="1.6" stroke-linecap="round"/>
    <g fill="none" stroke="${INK}" stroke-width="1.3" stroke-linecap="round" opacity=".55">
      <path d="M22 34 l3 -7 l3 7"/><path d="M118 46 l3 -7 l3 7 l3 -6"/><path d="M168 30 l3 -6 l3 6"/>
    </g>
    <g fill="${INK}" opacity=".3"><circle cx="70" cy="28" r="1.3"/><circle cx="84" cy="48" r="1.1"/><circle cx="150" cy="54" r="1.2"/><circle cx="40" cy="52" r="1"/></g>
    <g><circle cx="96" cy="30" r="3.2" fill="#fff" stroke="${INK}" stroke-width="1"/><circle cx="96" cy="30" r="1.2" fill="#e8c46a"/></g>
  </svg>`);

const boneSVG = `<svg viewBox="0 0 44 20"><path filter="url(#rough)"
  d="M8 4 Q2 2 2 8 Q2 10 4 10 Q2 12 3 16 Q6 19 10 15 L34 15 Q38 19 41 16 Q42 12 40 10 Q42 10 42 7 Q41 2 36 5 L10 5 Z"
  fill="#fff6e8" stroke="${INK}" stroke-width="1.5" stroke-linejoin="round"/></svg>`;

/* ============ 스탑워치 로직 ============ */
const $ = id => document.getElementById(id);
const display = $('display'), startBtn = $('startBtn'), lapBtn = $('lapBtn');
const lapList = $('laps'), stepsEl = $('steps'), statusEl = $('status'), dogsEl = $('dogs');

let running = false, startTime = 0, elapsed = 0, lapStart = 0, laps = [];
const now = () => running ? elapsed + (performance.now() - startTime) : elapsed;
const pad = n => String(n).padStart(2, '0');
function fmt(ms) {
  const h = Math.floor(ms / 3600000), m = Math.floor(ms / 60000) % 60;
  const s = Math.floor(ms / 1000) % 60, cs = Math.floor(ms / 10) % 100;
  return { main: (h ? h + ':' + pad(m) : pad(m)) + ':' + pad(s), cs: pad(cs) };
}

function setState() {
  const st = running ? 'running' : (elapsed ? 'paused' : 'sleeping');
  scene.className = 'scene sketch ' + st;
  statusEl.textContent = { running: '아장아장 산책 중', paused: '킁킁 쉬는 중', sleeping: '쿨쿨 자는 중' }[st];
  startBtn.textContent = running ? '멈춰!' : (elapsed ? '다시 가자!' : '산책 가자!');
  startBtn.classList.toggle('running', running);
  lapBtn.disabled = !running && elapsed === 0;
  lapBtn.textContent = running || elapsed === 0 ? '랩' : '집으로';
}

function renderLaps() {
  lapList.innerHTML = '';
  if (!running && elapsed === 0) return;
  const cur = document.createElement('li');
  cur.className = 'current';
  cur.innerHTML = `<span>랩 ${laps.length + 1}</span><span class="t"></span>`;
  lapList.appendChild(cur);
  const min = Math.min(...laps), max = Math.max(...laps);
  for (let i = laps.length - 1; i >= 0; i--) {
    const li = document.createElement('li');
    let tag = '';
    if (laps.length >= 2 && laps[i] === min) { li.className = 'best'; tag = ' ♡'; }
    else if (laps.length >= 2 && laps[i] === max) { li.className = 'worst'; tag = ' zz'; }
    const f = fmt(laps[i]);
    li.innerHTML = `<span>랩 ${i + 1}${tag}</span><span class="t">${f.main}.${f.cs}</span>`;
    lapList.appendChild(li);
  }
}

function tick() {
  const t = now(), f = fmt(t);
  display.innerHTML = `${f.main}.<span class="ms">${f.cs}</span>`;
  stepsEl.textContent = Math.floor(t / 360).toLocaleString();
  const cur = lapList.querySelector('li.current .t');
  if (cur) { const l = fmt(t - lapStart); cur.textContent = `${l.main}.${l.cs}`; }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

function toggle() {
  if (running) { elapsed += performance.now() - startTime; running = false; }
  else { startTime = performance.now(); running = true; }
  setState(); renderLaps();
}

function spawn(cls, html, x, y, dx) {
  const el = document.createElement('div');
  el.className = 'fx ' + cls; el.innerHTML = html;
  el.style.left = x + 'px'; el.style.top = y + 'px';
  if (dx !== undefined) el.style.setProperty('--dx', dx + 'px');
  scene.appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}

function lap() {
  if (!running) return;
  const t = now(); laps.push(t - lapStart); lapStart = t;
  renderLaps();
  const w = scene.clientWidth, h = scene.clientHeight;
  spawn('bone', boneSVG, w / 2 - 20, h - 110, (Math.random() - .5) * 140);
  dogsEl.classList.remove('jump'); void dogsEl.offsetWidth; dogsEl.classList.add('jump');
  setTimeout(() => dogsEl.classList.remove('jump'), 600);
  [w / 2 - 95, w / 2 + 75].forEach((x, i) => setTimeout(() => spawn('heart', '♡', x, h - 205), i * 120));
}

function reset() {
  if (running) return;
  elapsed = 0; lapStart = 0; laps = [];
  setState(); renderLaps();
}

startBtn.addEventListener('click', toggle);
lapBtn.addEventListener('click', () => running ? lap() : reset());
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  else if (e.key === 'l' || e.key === 'L') lap();
  else if (e.key === 'r' || e.key === 'R') reset();
});
setState();
</script>
</body>
</html>
